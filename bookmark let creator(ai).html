<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blooket Script Bookmarklet Maker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        textarea {
            width: 100%;
            height: 150px;
            margin-bottom: 15px;
            font-family: monospace;
        }
        input[type="text"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        button {
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #outputLink {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: grab;
        }
        #outputLink:active {
            cursor: grabbing;
        }
    </style>
</head>
<body>

    <h2>Blooket Bookmarklet Generator</h2>
    <p>Convert raw JavaScript scripts into a browser bookmarklet link.</p>

    <label for="scriptName"><strong>Bookmark Name:</strong></label>
    <input type="text" id="scriptName" value="Blooket Script" placeholder="e.g., Get All Blocks">

    <label for="jsCode"><strong>Paste JavaScript Code Here:</strong></label>
    <textarea id="jsCode" placeholder="fetch('https://githubusercontent.com...').then(...)"></textarea>

    <button onclick="generateBookmarklet()">Generate Link</button>

    <div id="resultContainer" style="display:none;">
        <h3>Your Bookmarklet:</h3>
        <p>Drag the green button below directly to your browser's <strong>Bookmarks Bar</strong>:</p>
        <a id="outputLink" href="#">Drag Me</a>
    </div>

    <script>
        function generateBookmarklet() {
            const nameInput = document.getElementById('scriptName').value;
            const codeInput = document.getElementById('jsCode').value;
            const link = document.getElementById('outputLink');
            const container = document.getElementById('resultContainer');

            if (!codeInput.trim()) {
                alert('Please paste some code first!');
                return;
            }

            // Clean code and wrap into a self-executing anonymous function
            const cleanCode = codeInput.replace(/^\s*javascript:/i, '').trim();
            const bookmarkletCode = `javascript:(function(){${encodeURIComponent(cleanCode)}})();`;

            link.href = bookmarkletCode;
            link.textContent = nameInput || "Blooket Script";
            container.style.display = 'block';
        }
    </script>

</body>
</html>
